<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Project</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#F5F1E8;
    font-family:'Libre Baskerville',serif;
    min-height:100vh;
    overflow:hidden;
}


/* DUST */

.dust{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;

    background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.16) 1px,transparent 1px),
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.10) 1px,transparent 1px),
    radial-gradient(circle at 40% 80%,rgba(255,255,255,.12) 1px,transparent 1px);

    background-size:180px 180px;
    animation:dust 18s linear infinite;
    opacity:.35;
}


/* MUSIC */

audio{
    display:none;
}


/* =========================
   SCENE 0.1
========================= */

.scene0{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:#000;

    transition:opacity 1s ease;
}

.scene0Content{
    width:90%;
    max-width:600px;
}

.scene0Title{
    font-size:30px;
    letter-spacing:2px;
    margin-bottom:45px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:18px;
    align-items:center;
}

.option{
    width:220px;
    padding:13px 20px;

    background:transparent;
    color:#F5F1E8;

    border:1px solid #b99b5a;
    border-radius:30px;

    font-family:'Libre Baskerville',serif;
    font-size:17px;

    cursor:pointer;

    transition:.4s;
}

.option:hover{
    background:#b99b5a;
    color:#000;

    box-shadow:
    0 0 25px rgba(255,215,120,.5);
}


/* =========================
   ACCESS SCREEN
========================= */

.accessScreen{
    display:none;

    position:fixed;
    inset:0;

    z-index:50;

    background:#000;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    text-align:center;
}

.accessIcon{
    font-size:70px;
    margin-bottom:25px;
}

.accessText{
    font-size:25px;
    letter-spacing:3px;
}

.accessSub{
    margin-top:20px;
    font-size:15px;
    opacity:.7;
}

.granted{
    color:#ffe6a3;

    text-shadow:
    0 0 15px #ffe6a3,
    0 0 35px #ffe6a3;
}


/* LOADING BAR */

.loadingBar{
    width:230px;
    height:4px;

    margin-top:30px;

    background:#211c13;

    border-radius:10px;

    overflow:hidden;
}

.loadingProgress{
    width:0%;
    height:100%;

    background:#ffe6a3;

    box-shadow:
    0 0 10px #ffe6a3,
    0 0 20px #ffe6a3;

    transition:width .25s linear;
}


/* =========================
   SCENE 1
========================= */

.scene1{
    display:none;

    position:fixed;
    inset:0;

    z-index:5;

    justify-content:center;
    align-items:center;

    text-align:center;
}

.scene1Container{
    width:90%;
    max-width:700px;
}

.fade{
    opacity:0;
    animation:fade 2s forwards;
}

.line1{
    font-size:30px;
}

.key{
    font-size:110px;

    margin:35px 0;

    text-shadow:
    0 0 20px rgba(255,215,120,.45);

    animation-delay:3s;
}

.line2{
    font-size:24px;
    animation-delay:5s;
}

.line3{
    font-size:24px;

    margin:12px 0 40px;

    animation-delay:7s;
}

.buttons{
    animation-delay:9s;
}

.scene1 button{
    background:transparent;

    color:#F5F1E8;

    border:1px solid #F5F1E8;

    padding:12px 30px;

    border-radius:30px;

    margin:10px;

    font-size:18px;

    font-family:'Libre Baskerville',serif;

    cursor:pointer;
}

.scene1 button:hover{
    background:#F5F1E8;
    color:#111;
}


/* ANIMATIONS */

@keyframes fade{
    to{
        opacity:1;
    }
}

@keyframes dust{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-150px);
    }
}


/* MOBILE */

@media(max-width:600px){

    .scene0Title{
        font-size:24px;
    }

    .option{
        width:200px;
        font-size:15px;
    }

    .accessText{
        font-size:21px;
    }

    .loadingBar{
        width:200px;
    }

    .line1{
        font-size:24px;
    }

    .key{
        font-size:80px;
    }

    .line2,
    .line3{
        font-size:19px;
    }

}

</style>
</head>

<body>

<div class="dust"></div>


<!-- BACKGROUND MUSIC -->

<audio id="backgroundMusic" loop>
    <source src="love_story_x_golden_brown_[edit_audio](48k).mp3" type="audio/mpeg">
</audio>


<!-- =========================
     SCENE 0.1
========================= -->

<div class="scene0" id="scene0">

    <div class="scene0Content">

        <div class="scene0Title">
            Who are you?
        </div>

        <div class="options">

            <button
                class="option"
                onclick="checkAnswer('chomu')">
                Chomu
            </button>

            <button
                class="option"
                onclick="checkAnswer('aloo')">
                Aloo Paloo
            </button>

            <button
                class="option"
                onclick="checkAnswer('berozgar')">
                Berozgar
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ACCESS SCREEN
========================= -->

<div
    class="accessScreen"
    id="accessScreen">

    <div
        class="accessIcon"
        id="accessIcon">
        🚫
    </div>

    <div
        class="accessText"
        id="accessText">
        ACCESS NOT GRANTED
    </div>

    <div
        class="accessSub"
        id="accessSub">
        Choose again.
    </div>

    <div
        class="loadingBar"
        id="loadingBar"
        style="display:none;">

        <div
            class="loadingProgress"
            id="loadingProgress">
        </div>

    </div>

</div>


<!-- =========================
     SCENE 1
========================= -->

<div
    class="scene1"
    id="scene1">

    <div class="scene1Container">

        <div class="line1 fade">
            Har chaabi ki ek manzil hoti hai.
        </div>

        <div class="key fade">
            🗝️
        </div>

        <div class="line2 fade">
            Sawaal bas itna hai...
        </div>

        <div class="line3 fade">
            ...kya tum usse dhoondhna chahoge?
        </div>

        <div class="buttons fade">

            <button
                onclick="alert('Theek hai 😤\n\nLekin maine bola hai to dekhna padega.')">
                Nahi
            </button>

            <button
                onclick="continueJourney()">
                Haan
            </button>

        </div>

    </div>

</div>


<script>

/* MUSIC */

const audio =
document.getElementById("backgroundMusic");

audio.volume = 0.15;


/* CHECK ANSWER */

function checkAnswer(answer){

    const scene0 =
    document.getElementById("scene0");

    const accessScreen =
    document.getElementById("accessScreen");

    const accessIcon =
    document.getElementById("accessIcon");

    const accessText =
    document.getElementById("accessText");

    const accessSub =
    document.getElementById("accessSub");

    const loadingBar =
    document.getElementById("loadingBar");

    const loadingProgress =
    document.getElementById("loadingProgress");


    /* WRONG ANSWER */

    if(answer !== "aloo"){

        accessIcon.innerHTML =
        "🚫";

        accessText.innerHTML =
        "ACCESS NOT GRANTED";

        accessText.classList.remove(
            "granted"
        );

        accessSub.innerHTML =
        "Choose again.";

        loadingBar.style.display =
        "none";

        accessScreen.style.display =
        "flex";


        setTimeout(function(){

            accessScreen.style.display =
            "none";

        },3000);

        return;
    }


    /* CORRECT ANSWER */

    scene0.style.display =
    "none";


    accessIcon.innerHTML =
    "✓";

    accessText.innerHTML =
    "ACCESS GRANTED";

    accessText.classList.add(
        "granted"
    );

    accessSub.innerHTML =
    "AUTHENTICATING";

    loadingBar.style.display =
    "block";

    loadingProgress.style.width =
    "0%";

    accessScreen.style.display =
    "flex";


    /* START MUSIC */

    audio.volume = 0.15;

    audio.currentTime = 0;

    audio.play().catch(function(){

        console.log(
            "Audio could not start."
        );

    });


    /* LOADING */

    let progress = 0;

    const loading =
    setInterval(function(){

        progress += 5;

        loadingProgress.style.width =
        progress + "%";

        if(progress >= 100){

            clearInterval(loading);

        }

    },150);


    /* AUTHENTICATING DOTS */

    let dots = 0;

    const dotTimer =
    setInterval(function(){

        dots++;

        if(dots > 3){
            dots = 1;
        }

        accessSub.innerHTML =
        "AUTHENTICATING" +
        ".".repeat(dots);

    },400);


    /* GRANTED */

    setTimeout(function(){

        clearInterval(dotTimer);

        accessSub.innerHTML =
        "MEMORY ACCESS GRANTED";

    },3200);


    /* SHOW SCENE 1 */

    setTimeout(function(){

        accessScreen.style.display =
        "none";

        document.getElementById(
            "scene1"
        ).style.display =
        "flex";

    },4800);

}


/* SCENE 1 → SCENE 2 */

function continueJourney(){

    window.location.href =
    "scene2.html";

}

</script>

</body>
    </html>
