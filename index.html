<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Project</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#F5F1E8;
    font-family:'Libre Baskerville',serif;
    min-height:100vh;
    overflow:hidden;
}

.dust{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;

    background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.16) 1px,transparent 1px),
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.10) 1px,transparent 1px),
    radial-gradient(circle at 40% 80%,rgba(255,255,255,.12) 1px,transparent 1px);

    background-size:180px 180px;

    animation:dustMove 18s linear infinite;

    opacity:.35;
}

@keyframes dustMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-150px);
    }

}


/* =========================
   BACKGROUND MUSIC
========================= */

#backgroundMusic,
#doorSong{
    display:none;
}


/* =========================
   SCENE 0.1
========================= */

.scene0{

    position:fixed;

    inset:0;

    z-index:10;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:#000;

}

.scene0Content{

    width:90%;

    max-width:600px;

}

.scene0Title{

    font-size:30px;

    letter-spacing:2px;

    margin-bottom:45px;

}

.options{

    display:flex;

    flex-direction:column;

    gap:18px;

    align-items:center;

}

.option{

    width:220px;

    padding:13px 20px;

    background:transparent;

    color:#F5F1E8;

    border:1px solid #b99b5a;

    border-radius:30px;

    font-family:'Libre Baskerville',serif;

    font-size:17px;

    cursor:pointer;

    transition:.4s;

}

.option:hover{

    background:#b99b5a;

    color:#000;

    box-shadow:0 0 25px rgba(255,215,120,.5);

}


/* =========================
   ACCESS
========================= */

.accessScreen{

    display:none;

    position:fixed;

    inset:0;

    z-index:50;

    background:#000;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    text-align:center;

}

.accessIcon{

    font-size:70px;

    margin-bottom:25px;

}

.accessText{

    font-size:25px;

    letter-spacing:3px;

}

.accessSub{

    margin-top:20px;

    font-size:15px;

    opacity:.7;

}

.granted{

    color:#ffe6a3;

    text-shadow:

    0 0 15px #ffe6a3,

    0 0 35px #ffe6a3;

}

.loadingBar{

    width:230px;

    height:4px;

    margin-top:30px;

    background:#211c13;

    border-radius:10px;

    overflow:hidden;

}

.loadingProgress{

    width:0%;

    height:100%;

    background:#ffe6a3;

    box-shadow:

    0 0 10px #ffe6a3,

    0 0 20px #ffe6a3;

    transition:width .25s linear;

}


/* =========================
   SCENE 1
========================= */

.scene1{

    display:none;

    position:fixed;

    inset:0;

    z-index:5;

    justify-content:center;

    align-items:center;

    text-align:center;

}

.scene1Container{

    width:90%;

    max-width:700px;

}

.fade{

    opacity:0;

    animation:fade 2s forwards;

}

.line1{

    font-size:30px;

}

.key{

    font-size:110px;

    margin:35px 0;

    text-shadow:0 0 20px rgba(255,215,120,.45);

    animation-delay:3s;

}

.line2{

    font-size:24px;

    animation-delay:5s;

}

.line3{

    font-size:24px;

    margin:12px 0 40px;

    animation-delay:7s;

}

.buttons{

    animation-delay:9s;

}

.scene1 button{

    background:transparent;

    color:#F5F1E8;

    border:1px solid #F5F1E8;

    padding:12px 30px;

    border-radius:30px;

    margin:10px;

    font-size:18px;

    font-family:'Libre Baskerville',serif;

    cursor:pointer;

}

.scene1 button:hover{

    background:#F5F1E8;

    color:#111;

}


/* =========================
   SCENE 2 HALLWAY
========================= */

.hallwayScreen{

    display:none;

    position:fixed;

    inset:0;

    z-index:5;

    width:100%;

    min-height:100vh;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}

.title{

    font-size:30px;

    letter-spacing:2px;

    margin-bottom:35px;

    text-align:center;

}

.hallway{

    position:relative;

    width:520px;

    height:520px;

}


/* DOORS */

.door{

    position:absolute;

    width:95px;

    height:170px;

    background:#17120c;

    border:2px solid #b99b5a;

    box-shadow:0 0 20px rgba(255,215,120,.3);

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:14px;

    cursor:pointer;

    transition:

    transform 1s ease,

    opacity 1s ease,

    box-shadow .5s ease;

}

.door:hover{

    box-shadow:0 0 40px rgba(255,215,120,.8);

}

.door1{

    top:0;

    left:212px;

}

.door2{

    top:85px;

    right:20px;

}

.door3{

    bottom:85px;

    right:20px;

}

.door4{

    bottom:0;

    left:212px;

}

.door5{

    bottom:85px;

    left:20px;

}

.door6{

    top:85px;

    left:20px;

}


/* LIGHTS */

.light{

    position:absolute;

    width:13px;

    height:13px;

    border-radius:50%;

    background:#ffe6a3;

    box-shadow:0 0 25px #ffe6a3;

    transition:opacity 1s ease;

}

.light1{

    top:75px;

    left:260px;

}

.light2{

    top:180px;

    right:95px;

}

.light3{

    bottom:180px;

    right:95px;

}

.light4{

    bottom:75px;

    left:260px;

}

.light5{

    bottom:180px;

    left:95px;

}

.light6{

    top:180px;

    left:95px;

}


/* =========================
   MEMORY
========================= */

.memoryScreen{

    display:none;

    position:fixed;

    inset:0;

    z-index:1000;

    background:#000;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    text-align:center;

    padding:25px;

}

.placeholder{

    width:280px;

    height:360px;

    border:2px solid #b99b5a;

    background:

    radial-gradient(

        circle,

        rgba(255,215,120,.12),

        rgba(0,0,0,.95)

    );

    display:flex;

    justify-content:center;

    align-items:center;

    color:#b99b5a;

    font-size:14px;

    letter-spacing:1px;

    box-shadow:0 0 35px rgba(255,215,120,.25);

}

.memoryMessage{

    margin-top:28px;

    max-width:600px;

    font-size:20px;

    line-height:1.7;

}

.continueButton{

    margin-top:30px;

    padding:12px 32px;

    border-radius:30px;

    background:transparent;

    color:#F5F1E8;

    border:1px solid #b99b5a;

    font-family:'Libre Baskerville',serif;

    cursor:pointer;

    transition:.4s;

}

.continueButton:hover{

    background:#b99b5a;

    color:#000;

}


/* =========================
   KEY
========================= */

.keyScreen{

    display:none;

    position:fixed;

    inset:0;

    z-index:1100;

    background:#000;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    text-align:center;

}

.keySymbol{

    font-size:70px;

    animation:keyGlow 2s ease-in-out infinite alternate;

}

.keyText{

    margin-top:25px;

    font-size:24px;

    letter-spacing:3px;

}

@keyframes keyGlow{

    from{

        opacity:.5;

        transform:scale(.95);

        text-shadow:0 0 10px #ffe6a3;

    }

    to{

        opacity:1;

        transform:scale(1.05);

        text-shadow:

        0 0 20px #ffe6a3,

        0 0 40px #ffe6a3;

    }

}

@keyframes fade{

    to{

        opacity:1;

    }

}


/* MOBILE */

@media(max-width:600px){

    .scene0Title{

        font-size:24px;

    }

    .option{

        width:200px;

        font-size:15px;

    }

    .accessText{

        font-size:21px;

    }

    .line1{

        font-size:24px;

    }

    .key{

        font-size:80px;

    }

    .line2,

    .line3{

        font-size:19px;

    }

    .hallway{

        transform:scale(.72);

    }

}

</style>
</head>


<body>


<div class="dust"></div>


<!-- =========================
     MUSIC
========================= -->

<audio id="backgroundMusic" loop>

    <source
        src="love_story_x_golden_brown_[edit_audio](48k)"
        type="audio/mpeg">

</audio>


<audio id="doorSong"></audio>


<!-- =========================
     SCENE 0.1
========================= -->

<div class="scene0" id="scene0">

    <div class="scene0Content">

        <div class="scene0Title">
            Who are you?
        </div>

        <div class="options">

            <button
                class="option"
                onclick="checkAnswer('chomu')">
                Chomu
            </button>

            <button
                class="option"
                onclick="checkAnswer('aloo')">
                Aloo Paloo
            </button>

            <button
                class="option"
                onclick="checkAnswer('berozgar')">
                Berozgar
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ACCESS
========================= -->

<div class="accessScreen" id="accessScreen">

    <div class="accessIcon" id="accessIcon">
        🚫
    </div>

    <div class="accessText" id="accessText">
        ACCESS NOT GRANTED
    </div>

    <div class="accessSub" id="accessSub">
        Choose again.
    </div>

    <div
        class="loadingBar"
        id="loadingBar"
        style="display:none;">

        <div
            class="loadingProgress"
            id="loadingProgress">
        </div>

    </div>

</div>


<!-- =========================
     SCENE 1
========================= -->

<div class="scene1" id="scene1">

    <div class="scene1Container">

        <div class="line1 fade">
            Har chaabi ki ek manzil hoti hai.
        </div>

        <div class="key fade">
            🗝️
        </div>

        <div class="line2 fade">
            Sawaal bas itna hai...
        </div>

        <div class="line3 fade">
            ...kya tum usse dhoondhna chahoge?
        </div>

        <div class="buttons fade">

            <button onclick="nahi()">
                Nahi
            </button>

            <button onclick="goToScene2()">
                Haan
            </button>

        </div>

    </div>

</div>


<!-- =========================
     SCENE 2
========================= -->

<div
    class="hallwayScreen"
    id="hallwayScreen">

    <div class="title">
        Find the key...
    </div>

    <div class="hallway">


        <div
            class="door door1"
            onclick="openDoor(1,this)">
            Door 1
        </div>

        <div
            class="door door2"
            onclick="openDoor(2,this)">
            Door 2
        </div>

        <div
            class="door door3"
            onclick="openDoor(3,this)">
            Door 3
        </div>

        <div
            class="door door4"
            onclick="openDoor(4,this)">
            Door 4
        </div>

        <div
            class="door door5"
            onclick="openDoor(5,this)">
            Door 5
        </div>

        <div
            class="door door6"
            onclick="openDoor(6,this)">
            Door 6
        </div>


        <div class="light light1"></div>

        <div class="light light2"></div>

        <div class="light light3"></div>

        <div class="light light4"></div>

        <div class="light light5"></div>

        <div class="light light6"></div>

    </div>

</div>


<!-- =========================
     MEMORY
========================= -->

<div
    class="memoryScreen"
    id="memoryScreen">

    <div class="placeholder">
        MEMORY PHOTO
    </div>

    <div
        class="memoryMessage"
        id="memoryMessage">
        A memory waits here...
    </div>

    <button
        class="continueButton"
        onclick="closeMemory()">

        Continue

    </button>

</div>


<!-- =========================
     KEY
========================= -->

<div
    class="keyScreen"
    id="keyScreen">

    <div class="keySymbol">
        🗝️
    </div>

    <div class="keyText">
        You found the key.
    </div>

</div>


<script>


/* =========================
   AUDIO
========================= */

const backgroundMusic =
document.getElementById("backgroundMusic");

const doorSong =
document.getElementById("doorSong");

backgroundMusic.volume = 0.15;

doorSong.volume = 0.30;


/* =========================
   SCENE 0.1
========================= */

function checkAnswer(answer){

    const scene0 =
    document.getElementById("scene0");

    const access =
    document.getElementById("accessScreen");

    const icon =
    document.getElementById("accessIcon");

    const text =
    document.getElementById("accessText");

    const sub =
    document.getElementById("accessSub");

    const bar =
    document.getElementById("loadingBar");

    const progress =
    document.getElementById("loadingProgress");


    /* WRONG */

    if(answer !== "aloo"){

        icon.innerHTML = "🚫";

        text.innerHTML =
        "ACCESS NOT GRANTED";

        text.classList.remove("granted");

        sub.innerHTML =
        "Choose again.";

        bar.style.display =
        "none";

        access.style.display =
        "flex";


        setTimeout(function(){

            access.style.display =
            "none";

        },3000);

        return;

    }


    /* CORRECT */

    scene0.style.display =
    "none";

    icon.innerHTML =
    "✓";

    text.innerHTML =
    "ACCESS GRANTED";

    text.classList.add("granted");

    sub.innerHTML =
    "AUTHENTICATING";

    bar.style.display =
    "block";

    progress.style.width =
    "0%";

    access.style.display =
    "flex";


    /* START BACKGROUND MUSIC */

    backgroundMusic.currentTime = 0;

    backgroundMusic.play().catch(function(){

        console.log("Audio blocked.");

    });


    /* LOADING */

    let value = 0;

    const loader =
    setInterval(function(){

        value += 5;

        progress.style.width =
        value + "%";

        if(value >= 100){

            clearInterval(loader);

        }

    },150);


    let dots = 0;

    const dotTimer =
    setInterval(function(){

        dots++;

        if(dots > 3){
            dots = 1;
        }

        sub.innerHTML =
        "AUTHENTICATING" +
        ".".repeat(dots);

    },400);


    setTimeout(function(){

        clearInterval(dotTimer);

        sub.innerHTML =
        "MEMORY ACCESS GRANTED";

    },3200);


    setTimeout(function(){

        access.style.display =
        "none";

        document.getElementById("scene1").style.display =
        "flex";

    },4800);

}


/* =========================
   SCENE 1
========================= */

function nahi(){

    alert(
        "Theek hai 😤\n\nLekin maine bola hai to dekhna padega."
    );

}


function goToScene2(){

    document.getElementById("scene1").style.display =
    "none";

    document.getElementById("hallwayScreen").style.display =
    "flex";

}


/* =========================
   SCENE 2
========================= */

const messages = {

    1:"A memory waits here...",

    2:"Another moment worth remembering...",

    3:"Some moments stay with us...",

    4:"A little piece of the journey...",

    5:"Another memory...",

    6:"One more memory before the end..."

};


const songs = {

    1:"i_wanna_be_yours__tiktok_version_____arctic_monkeys_[_edit_audio_](48k)",

    2:"chuttamalle_-_shilpa_rao_,_anirudh_ravichander_[edit_audio](48k)",

    3:"Ishq_De_Fanniyar_-_Jyotica_[edit_audio](48k)",

    4:"arz_kiya_hai_-_anuv_jain_x_lost_stories__coke_studio__[edit_audio](48k)",

    5:"o_meri_laila_-_atif_aslam___jyotica_tangri_[_edit_audio_](48k)",

    6:"suzume_theme_song_-_suzume_ft._toaka_[edit_audio](48k)"

};


const songLimits = {

    1:60,

    2:61,

    3:64,

    4:36,

    5:56,

    6:30

};


let openedDoors = [];

let currentDoor = null;


/* SAVE BACKGROUND POSITION */

let backgroundPosition = 0;


/* =========================
   OPEN DOOR
========================= */

function openDoor(number,door){

    if(openedDoors.includes(number)){
        return;
    }


    const remainingDoors =
    document.querySelectorAll(
        '.door:not([style*="opacity: 0"])'
    );


    /* LAST DOOR */

    if(remainingDoors.length === 1){

        backgroundPosition =
        backgroundMusic.currentTime;

        backgroundMusic.pause();

        openKey();

        return;

    }


    currentDoor = door;

    openedDoors.push(number);


    /* SAVE BACKGROUND POSITION */

    backgroundPosition =
    backgroundMusic.currentTime;


    /* PAUSE BACKGROUND */

    backgroundMusic.pause();


    /* LIGHT OFF */

    const light =
    document.querySelector(
        '.light' + number
    );

    if(light){

        light.style.opacity =
        "0";

    }


    /* DOOR ANIMATION */

    door.style.transform =
    "scale(2.3)";

    door.style.opacity =
    "0";


    /* PLAY DOOR SONG */

    playDoorSong(number);


    setTimeout(function(){

        document.getElementById(
            "hallwayScreen"
        ).style.display =
        "none";


        document.getElementById(
            "memoryMessage"
        ).innerHTML =
        messages[number];


        document.getElementById(
            "memoryScreen"
        ).style.display =
        "flex";

    },1000);

}


/* =========================
   DOOR SONG
========================= */

function playDoorSong(number){

    doorSong.pause();

    doorSong.currentTime =
    0;

    doorSong.src =
    songs[number];

    doorSong.volume =
    0.30;

    doorSong.play().catch(function(){

        console.log("Door song blocked.");

    });


    setTimeout(function(){

        doorSong.pause();

    },songLimits[number] * 1000);

}


/* =========================
   CLOSE MEMORY
========================= */

function closeMemory(){

    /* STOP DOOR SONG */

    doorSong.pause();

    doorSong.currentTime =
    0;


    document.getElementById(
        "memoryScreen"
    ).style.display =
    "none";


    document.getElementById(
        "hallwayScreen"
    ).style.display =
    "flex";


    /* RESUME BACKGROUND */

    backgroundMusic.currentTime =
    backgroundPosition;

    backgroundMusic.volume =
    0.15;

    backgroundMusic.play().catch(function(){

        console.log("Background music waiting.");

    });

}


/* =========================
   KEY
========================= */

function openKey(){

    doorSong.pause();

    doorSong.currentTime =
    0;


    document.getElementById(
        "hallwayScreen"
    ).style.display =
    "none";


    document.getElementById(
        "memoryScreen"
    ).style.display =
    "none";


    document.getElementById(
        "keyScreen"
    ).style.display =
    "flex";

}

</script>

</body>
</html>
