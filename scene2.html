<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Hallway</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#F5F1E8;
    font-family:'Libre Baskerville',serif;
    min-height:100vh;
    overflow:hidden;
}

.dust{
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.16) 1px,transparent 1px),
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.10) 1px,transparent 1px);

    background-size:180px 180px;
    animation:dustMove 18s linear infinite;
    opacity:.35;
}

/* HALLWAY */

.container{
    position:relative;
    z-index:2;
    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.title{
    font-size:30px;
    letter-spacing:2px;
    margin-bottom:35px;
    text-align:center;
}

.hallway{
    position:relative;
    width:520px;
    height:520px;
}

/* DOORS */

.door{
    position:absolute;

    width:95px;
    height:170px;

    background:#17120c;
    border:2px solid #b99b5a;

    box-shadow:0 0 20px rgba(255,215,120,.3);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:14px;
    cursor:pointer;

    transition:
    transform 1s ease,
    opacity 1s ease,
    box-shadow .5s ease;
}

.door:hover{
    box-shadow:0 0 40px rgba(255,215,120,.8);
}

.door1{
    top:0;
    left:212px;
}

.door2{
    top:85px;
    right:20px;
}

.door3{
    bottom:85px;
    right:20px;
}

.door4{
    bottom:0;
    left:212px;
}

.door5{
    bottom:85px;
    left:20px;
}

.door6{
    top:85px;
    left:20px;
}
