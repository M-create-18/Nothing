<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Hallway</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#F5F1E8;
    font-family:'Libre Baskerville',serif;
    min-height:100vh;
    overflow:hidden;
}

.dust{
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.16) 1px,transparent 1px),
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.10) 1px,transparent 1px);

    background-size:180px 180px;
    animation:dustMove 18s linear infinite;
    opacity:.35;
}

.container{
    position:relative;
    z-index:2;
    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.title{
    font-size:30px;
    letter-spacing:2px;
    margin-bottom:35px;
    text-align:center;
    animation:fadeIn 2s ease forwards;
}

.hallway{
    position:relative;
    width:520px;
    height:520px;
}

.door{
    position:absolute;

    width:95px;
    height:170px;

    background:#17120c;
    border:2px solid #b99b5a;

    box-shadow:0 0 20px rgba(255,215,120,.3);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:14px;
    cursor:pointer;

    transition:
        transform 1s ease,
        opacity 1s ease,
        box-shadow .5s ease;
}

.door:hover{
    box-shadow:0 0 40px rgba(255,215,120,.8);
}

.door1{
    top:0;
    left:212px;
}

.door2{
    top:85px;
    right:20px;
}

.door3{
    bottom:85px;
    right:20px;
}

.door4{
    bottom:0;
    left:212px;
}

.door5{
    bottom:85px;
    left:20px;
}

.door6{
    top:85px;
    left:20px;
}

.light{
    position:absolute;

    width:13px;
    height:13px;

    border-radius:50%;

    background:#ffe6a3;

    box-shadow:
        0 0 25px #ffe6a3;
}

.light1{
    top:75px;
    left:260px;
}

.light2{
    top:180px;
    right:95px;
}

.light3{
    bottom:180px;
    right:95px;
}

.light4{
    bottom:75px;
    left:260px;
}

.light5{
    bottom:180px;
    left:95px;
}

.light6{
    top:180px;
    left:95px;
}

@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes dustMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-150px);
    }

}

@media(max-width:600px){

    .hallway{
        width:90vw;
        height:90vw;
        max-width:400px;
        max-height:400px;
    }

    .door{
        width:70px;
        height:125px;
        font-size:11px;
    }

    .door1{
        left:calc(50% - 35px);
    }

    .door2{
        top:17%;
        right:0;
    }

    .door3{
        bottom:17%;
        right:0;
    }

    .door4{
        bottom:0;
        left:calc(50% - 35px);
    }

    .door5{
        bottom:17%;
        left:0;
    }

    .door6{
        top:17%;
        left:0;
    }

    .title{
        font-size:20px;
        margin-bottom:25px;
    }

}

</style>
</head>

<body>

<div class="dust"></div>

<div class="container">

    <div class="title">
        Your journey begins... 

        Find the key!
    </div>

    <div class="hallway">

        <div class="door door1" onclick="openDoor(this)">
            Door 1
        </div>

        <div class="door door2" onclick="openDoor(this)">
            Door 2
        </div>

        <div class="door door3" onclick="openDoor(this)">
            Door 3
        </div>

        <div class="door door4" onclick="openDoor(this)">
            Door 4
        </div>

        <div class="door door5" onclick="openDoor(this)">
            Door 5
        </div>

        <div class="door door6" onclick="openDoor(this)">
            Door 6
        </div>

        <div class="light light1"></div>
        <div class="light light2"></div>
        <div class="light light3"></div>
        <div class="light light4"></div>
        <div class="light light5"></div>
        <div class="light light6"></div>

    </div>

</div>

<script>

function openDoor(door){

    door.style.transform = "scale(2.3)";
    door.style.opacity = "0";

}

</script>

</body>
</html>
